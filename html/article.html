<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article</title>
  <link rel="stylesheet" href="style_article.css">
</head>

<body>
  <header>
    <a href="index.html">&larr; Back to all articles</a>
    <nav>
      <ul>
        <li><a href="index.html">Blog</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <article>
      <div class="tag" id="article-tag"></div>
      <h1 id="article-title"></h1>

      <div class="byline">
        <span class="avatar" id="article-avatar"></span>
        <span class="author" id="article-author"></span>
        <span class="date" id="article-date"></span>
        <span class="read-time" id="article-read-time"></span>
      </div>

      <div class="admin-actions">
        <button type="button">Replace</button>
        <button type="button">Remove</button>
      </div>

      <div class="body-content" id="article-body"></div>

      <ul class="tags" id="article-tags"></ul>
    </article>
  </main>

  <script src="article.js"></script>
</body>

</html>
