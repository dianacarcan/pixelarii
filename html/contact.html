<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Ninja - Contact</title>
    <link rel="stylesheet" href="style_contact.css">
  </head>

  <body>
    <nav>
      <h3><strong>Food Ninja</strong></h3>

      <ul>
        <li><a href="article.html">Blog</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>

    <div class="container">
      <h1>Get in Touch</h1>

      <h4>
        Have a story to share? A restaurant to recommend? I'd love to hear from
        you.
      </h4>

      <form style="opacity: 70%">
        <p>Name</p>
        <input type="text" placeholder="Your name" />

        <p>Email</p>
        <input type="email" placeholder="your.email@example.com" />

        <p>Message</p>
        <textarea placeholder="Your message..."></textarea>

        <br />
        <input type="submit" value="Send Message" />
      </form>

      <h2>Other Ways to Reach Me</h2>

      <p>Email: hello@foodninja.com</p>
      <p>Twitter: @foodninja</p>
      <p>Instagram: @foodninja.eats</p>
    </div>
  </body>
</html>
